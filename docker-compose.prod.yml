services:
  postgres:
    image: postgres:15-alpine
    container_name: kongossa-postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: kongossa_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kongossa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kongossa_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./kongossa-backend
      dockerfile: Dockerfile.prod
    container_name: kongossa-backend
    ports:
      - "3000:3000"
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Hard lock on the API docs: setup-swagger.ts refuses to mount Swagger
      # unless ENABLE_SWAGGER=true AND APP_ENV is not "production".
      - APP_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@postgres:5432/kongossa_db
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRATION=15m
      - JWT_REFRESH_TTL_DAYS=7
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PAYMENT_LINKS_WEBHOOK_SECRET=${STRIPE_PAYMENT_LINKS_WEBHOOK_SECRET}
      - CORS_ORIGIN=https://kongossapay.com
      - FRONTEND_URL=https://kongossapay.com
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kongossa-network
    volumes:
      - ./kongossa-backend/uploads:/app/uploads
      - ./kongossa-backend/backups:/app/backups
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: ./kongossa-pay-ts
      dockerfile: Dockerfile.prod
      args:
        VITE_APP_API_URL: https://api.kongossapay.com
        VITE_APP_DOMAIN: https://kongossapay.com
    container_name: kongossa-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./kongossa-backend/uploads:/backend-uploads:ro
      # Basic-auth credentials for the sandbox /api-docs vhost.
      # Create on the host with: htpasswd -c ./nginx/.htpasswd-docs <username>
      - ./nginx/.htpasswd-docs:/etc/nginx/.htpasswd-docs:ro
      # Serve the nginx config from the host instead of the copy baked into the
      # image at build time. The frontend runs a prebuilt GHCR image, so without
      # this every vhost change would require rebuilding and pushing that image.
      # With it: edit the file, then `docker exec kongossa-frontend nginx -s reload`.
      - ./kongossa-pay-ts/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # kongossa-agent-app is a separate Vite SPA served from this same nginx
      # (kongossapayagent.com's server block in nginx.conf -- its own
      # purchased domain, not a kongossapay.com subdomain), not its own
      # container/image -- rebuild it on the host with `npm run build`, this
      # mount just needs its dist/ to exist.
      - ./kongossa-agent-app/dist:/usr/share/nginx/agent-html:ro
    depends_on:
      - backend
    networks:
      - kongossa-network
      # This nginx also fronts sandbox-api.kongossapay.com, so it must be able
      # to reach the sandbox stack. Only the reverse proxy joins both networks —
      # the production backend and database never see the sandbox network.
      - kongossa-sandbox-network

networks:
  kongossa-network:
    driver: bridge
  # Created by docker-compose.sandbox.yml. Bring the sandbox stack up first,
  # or `docker network create kongossa-sandbox-network`, otherwise this stack
  # will not start.
  kongossa-sandbox-network:
    external: true
    name: kongossa-sandbox-network

volumes:
  postgres_data:
