# HTTP -> HTTPS redirect for all domains
server {
    listen 80;
    server_name kongossapay.com www.kongossapay.com api.kongossapay.com sandbox-api.kongossapay.com;
    return 301 https://$host$request_uri;
}

# Main domain - HTTPS (Frontend)
server {
    listen 443 ssl;
    http2 on;
    server_name kongossapay.com www.kongossapay.com;

    ssl_certificate /etc/letsencrypt/live/kongossapay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kongossapay.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# API subdomain - HTTPS (Backend Proxy) - No CORS headers here
server {
    listen 443 ssl;
    http2 on;
    server_name api.kongossapay.com;

    ssl_certificate /etc/letsencrypt/live/kongossapay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kongossapay.com/privkey.pem;

    client_max_body_size 100M;

    # Serve uploaded files directly from backend uploads folder
    location /uploads/ {
        alias /backend-uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API documentation is NEVER served from production.
    # The backend also refuses to mount it when APP_ENV=production; this is the
    # second, independent lock so a misconfigured env var is not enough to leak
    # the spec. ^~ takes precedence over regex locations.
    location ^~ /api-docs {
        return 404;
    }

    # Proxy all API requests to backend
    location / {
        proxy_pass http://kongossa-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
# ---------------------------------------------------------------------------
# Sandbox API subdomain — the ONLY host the external mobile developer receives.
#
# Backed by the separate `kongossa-sandbox` compose stack (its own database,
# its own JWT secrets, test-mode payment keys, mail captured by Mailpit).
#
# IMPORTANT: the upstream host is referenced through a variable on purpose.
# nginx resolves a literal proxy_pass hostname at STARTUP, so if the sandbox
# container were down nginx would refuse to boot and take production offline
# with it. With a variable, resolution is deferred to request time: sandbox
# being down yields a 502 on this vhost only.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name sandbox-api.kongossapay.com;

    ssl_certificate /etc/letsencrypt/live/kongossapay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kongossapay.com/privkey.pem;

    client_max_body_size 100M;

    # Docker's embedded DNS, required for runtime resolution of the variable below.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sandbox_backend "kongossa-backend-sandbox:3000";

    # ---- API documentation: HTTP Basic auth ----------------------------------
    # A browser prompts for these credentials natively, which the previous
    # Bearer-header design could never do on a page navigation.
    # Revoke access with:  htpasswd -D /etc/nginx/.htpasswd-docs <user> && nginx -s reload
    location ^~ /api-docs {
        auth_basic "Kongossa Pay API documentation";
        auth_basic_user_file /etc/nginx/.htpasswd-docs;

        # Optional second factor: uncomment and set the developer's fixed IP.
        # allow 203.0.113.42;
        # deny all;

        proxy_pass http://$sandbox_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # ---- Mailpit: the developer's inbox --------------------------------------
    # Login is OTP-gated, so without access to the mailbox he cannot sign in.
    # Same Basic-auth credentials as the docs.
    location ^~ /mailpit {
        auth_basic "Kongossa Pay sandbox mailbox";
        auth_basic_user_file /etc/nginx/.htpasswd-docs;

        set $sandbox_mail "kongossa-mailpit-sandbox:8025";
        proxy_pass http://$sandbox_mail;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Mailpit's UI uses websockets for live message updates.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # ---- Sandbox API ---------------------------------------------------------
    location / {
        proxy_pass http://$sandbox_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
