# HTTP -> HTTPS redirect for all domains
server {
    listen 80;
    server_name kongossapay.com www.kongossapay.com api.kongossapay.com;
    return 301 https://$host$request_uri;
}

# Main domain - HTTPS (Frontend)
server {
    listen 443 ssl;
    http2 on;
    server_name kongossapay.com www.kongossapay.com;

    ssl_certificate /etc/letsencrypt/live/kongossapay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kongossapay.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# API subdomain - HTTPS (Backend Proxy) - No CORS headers here
server {
    listen 443 ssl;
    http2 on;
    server_name api.kongossapay.com;

    ssl_certificate /etc/letsencrypt/live/kongossapay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kongossapay.com/privkey.pem;

    client_max_body_size 100M;

    # Serve uploaded files directly from backend uploads folder
    location /uploads/ {
        alias /backend-uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy all API requests to backend
    location / {
        proxy_pass http://kongossa-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}