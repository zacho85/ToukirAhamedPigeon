name: Deploy to Hetzner Production

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  build-and-deploy:
    name: Build and Deploy to Hetzner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN_PAT }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/kongossa-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./kongossa-backend
          file: ./kongossa-backend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          # REMOVED: SMTP build arguments - they come from server .env
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/kongossa-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./kongossa-pay-ts
          file: ./kongossa-pay-ts/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_APP_API_URL=https://api.kongossapay.com
            VITE_APP_DOMAIN=https://kongossapay.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on Hetzner Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /var/www/kongossa-pay
            
            # Only update database and JWT in .env (preserve SMTP)
            if [ -f .env ]; then
              sed -i "s/DB_PASSWORD=.*/DB_PASSWORD=${{ secrets.DB_PASSWORD }}/" .env
              sed -i "s/JWT_SECRET=.*/JWT_SECRET=${{ secrets.JWT_SECRET }}/" .env
              sed -i "s/JWT_ACCESS_SECRET=.*/JWT_ACCESS_SECRET=${{ secrets.JWT_SECRET }}/" .env
              sed -i "s/JWT_REFRESH_SECRET=.*/JWT_REFRESH_SECRET=${{ secrets.JWT_SECRET }}/" .env
              sed -i "s/STRIPE_SECRET_KEY=.*/STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}/" .env
              sed -i "s/STRIPE_WEBHOOK_SECRET=.*/STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}/" .env
              # DO NOT touch SMTP lines
            fi
            
            # Pull latest code
            git fetch origin main
            git reset --hard origin/main
            
            # Restart only backend and postgres (keep frontend running)
            docker compose -f docker-compose.prod.yml stop backend postgres || true
            docker compose -f docker-compose.prod.yml rm -f backend postgres || true
            
            # Login to registry
            echo "${{ secrets.GH_TOKEN_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull and start
            docker compose -f docker-compose.prod.yml pull backend postgres
            docker compose -f docker-compose.prod.yml up -d backend postgres
            
            # Wait and migrate
            sleep 15
            docker compose -f docker-compose.prod.yml exec -T backend npx prisma migrate deploy || true
            
            # Cleanup
            docker system prune -f --filter "until=24h"
            
            echo "Deployment completed successfully!"