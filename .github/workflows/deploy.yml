name: Deploy to Hetzner Production

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      skip_backup:
        description: 'Skip database backup (risky!)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_migrations:
        description: 'Skip database migrations'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  packages: write

env:
  DOCKER_REGISTRY: ghcr.io
  BACKUP_RETENTION_DAYS: 7
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/kongossa-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/kongossa-frontend

jobs:
  backup-database:
    name: Backup Database Before Deployment
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_backup != 'true'
    
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Create Database Backup
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          script: |
            set -e
            BACKUP_DIR="/var/backups/kongossa-pay"
            TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
            BACKUP_FILE="$BACKUP_DIR/backup_${TIMESTAMP}.sql.gz"
            
            echo "=== Creating backup directory ==="
            sudo mkdir -p $BACKUP_DIR
            sudo chown -R $USER:$USER $BACKUP_DIR
            
            echo "=== Checking database container ==="
            if ! docker ps | grep -q kongossa-postgres; then
              echo "ERROR: Database container not running!"
              exit 1
            fi
            
            echo "=== Creating database backup ==="
            docker exec kongossa-postgres pg_dump -U kongossa_user -d kongossa_db | gzip > $BACKUP_FILE
            
            echo "=== Verifying backup ==="
            if [ -f "$BACKUP_FILE" ]; then
              FILE_SIZE=$(ls -lh $BACKUP_FILE | awk '{print $5}')
              echo "✅ Backup created: $BACKUP_FILE ($FILE_SIZE)"
              
              # Test backup integrity
              gunzip -t $BACKUP_FILE && echo "✅ Backup integrity verified"
            else
              echo "❌ Backup creation failed!"
              exit 1
            fi
            
            echo "=== Cleaning old backups (older than ${{ env.BACKUP_RETENTION_DAYS }} days) ==="
            find $BACKUP_DIR -name "backup_*.sql.gz" -type f -mtime +${{ env.BACKUP_RETENTION_DAYS }} -delete
            
            echo "=== Creating pre-deployment backup marker ==="
            echo "$TIMESTAMP" > "$BACKUP_DIR/last_backup.txt"
            
            echo "=== Backup completed ==="

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: backup-database
    if: |
      always() && 
      (needs.backup-database.result == 'success' || needs.backup-database.result == 'skipped')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN_PAT }}

      # Build Backend with multiple tags
      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./kongossa-backend
          file: ./kongossa-backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Build Frontend with multiple tags
      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./kongossa-pay-ts
          file: ./kongossa-pay-ts/Dockerfile.prod
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:${{ github.run_number }}
          build-args: |
            VITE_APP_API_URL=https://api.kongossapay.com
            VITE_APP_DOMAIN=https://kongossapay.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: build-images
    if: success()
    
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on Hetzner Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /var/www/kongossa-pay
            
            echo "=========================================="
            echo "🚀 DEPLOYMENT STARTED at $(date)"
            echo "=========================================="
            echo "Commit: ${{ github.sha }}"
            echo "Run: ${{ github.run_number }}"
            
            # Update docker-compose if needed (but preserve .env)
            echo "=== Updating repository (docker-compose only) ==="
            git fetch origin main
            git checkout main
            git pull origin main
            
            echo "=== Logging to GHCR ==="
            echo "${{ secrets.GH_TOKEN_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "=== Pulling new images ==="
            docker pull ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            docker pull ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            
            echo "=== Creating pre-migration backup ==="
            BACKUP_DIR="/var/backups/kongossa-pay/pre_migration"
            TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
            sudo mkdir -p $BACKUP_DIR
            
            # Backup database before any changes
            docker exec kongossa-postgres pg_dump -U kongossa_user -d kongossa_db | gzip > "$BACKUP_DIR/pre_migration_${TIMESTAMP}.sql.gz"
            echo "✅ Pre-migration backup created"
            
            # Backup current docker-compose
            cp docker-compose.prod.yml "$BACKUP_DIR/docker-compose_${TIMESTAMP}.yml"
            
            # Store current image tags for rollback
            CURRENT_BACKEND_IMAGE=$(docker inspect kongossa-backend --format='{{.Config.Image}}' 2>/dev/null || echo "")
            CURRENT_FRONTEND_IMAGE=$(docker inspect kongossa-frontend --format='{{.Config.Image}}' 2>/dev/null || echo "")
            echo "$CURRENT_BACKEND_IMAGE" > "$BACKUP_DIR/rollback_backend_image.txt"
            echo "$CURRENT_FRONTEND_IMAGE" > "$BACKUP_DIR/rollback_frontend_image.txt"
            
            echo "=== Running database migrations (if any) ==="
            if [ "${{ github.event.inputs.skip_migrations }}" != "true" ]; then
              # Check if migrations are needed
              echo "Checking migration status..."
              
              # Create a temporary container to run migrations
              docker run --rm \
                --network kongossa-pay_kongossa-network \
                -e DATABASE_URL="postgresql://kongossa_user:${DB_PASSWORD}@postgres:5432/kongossa_db" \
                ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
                npx prisma migrate status 2>&1 | tee /tmp/migration_status.txt
              
              if grep -q "Database schema is up to date" /tmp/migration_status.txt; then
                echo "✅ No pending migrations"
              else
                echo "⚠️ Pending migrations detected!"
                echo "Creating final backup before migration..."
                docker exec kongossa-postgres pg_dump -U kongossa_user -d kongossa_db | gzip > "$BACKUP_DIR/pre_migration_final_${TIMESTAMP}.sql.gz"
                
                echo "🔄 Applying migrations..."
                if docker run --rm \
                  --network kongossa-pay_kongossa-network \
                  -e DATABASE_URL="postgresql://kongossa_user:${DB_PASSWORD}@postgres:5432/kongossa_db" \
                  ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
                  npx prisma migrate deploy; then
                  echo "✅ Migrations applied successfully"
                  
                  # Regenerate Prisma client
                  docker run --rm \
                    --network kongossa-pay_kongossa-network \
                    -e DATABASE_URL="postgresql://kongossa_user:${DB_PASSWORD}@postgres:5432/kongossa_db" \
                    ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
                    npx prisma generate
                else
                  echo "❌ Migration failed!"
                  echo "Initiating rollback..."
                  
                  # Restore database
                  gunzip -c "$BACKUP_DIR/pre_migration_final_${TIMESTAMP}.sql.gz" | docker exec -i kongossa-postgres psql -U kongossa_user -d kongossa_db
                  
                  echo "✅ Database restored"
                  exit 1
                fi
              fi
            else
              echo "⚠️ Skipping database migrations as requested"
            fi
            
            echo "=== Updating docker-compose with new images ==="
            # Update docker-compose to use new images
            sed -i "s|image: ghcr.io/.*/kongossa-backend:.*|image: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}|g" docker-compose.prod.yml
            sed -i "s|image: ghcr.io/.*/kongossa-frontend:.*|image: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}|g" docker-compose.prod.yml
            
            echo "=== Starting new containers ==="
            docker compose -f docker-compose.prod.yml up -d --no-deps --remove-orphans backend frontend
            
            echo "=== Waiting for services to stabilize ==="
            sleep 15
            
            echo "=== Verifying deployment ==="
            
            # Health check backend
            for i in 1 2 3 4 5; do
              if curl -f -s -o /dev/null http://localhost:3000/health; then
                echo "✅ Backend is healthy"
                break
              fi
              echo "Attempt $i/5: Waiting for backend..."
              sleep 5
            done
            
            # Check frontend
            if curl -f -s -o /dev/null http://localhost/; then
              echo "✅ Frontend is accessible"
            else
              echo "⚠️ Frontend check failed"
            fi
            
            # Verify Prisma connection
            echo "=== Verifying database connection ==="
            docker exec kongossa-backend npx prisma db execute --help > /dev/null 2>&1 && echo "✅ Database connected" || echo "⚠️ Database connection warning"
            
            echo "=== Container status ==="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Image}}" | grep kongossa
            
            echo "=== Cleaning up old images ==="
            docker image prune -f --filter "until=48h"
            docker system prune -f --filter "until=24h"
            
            echo "=========================================="
            echo "✅ DEPLOYMENT COMPLETED at $(date)"
            echo "=========================================="

  rollback:
    name: Emergency Rollback
    runs-on: ubuntu-latest
    needs: [deploy]
    if: failure() && github.event.inputs.skip_backup != 'true'
    
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Execute Rollback
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/kongossa-pay
            
            echo "=========================================="
            echo "⚠️ EMERGENCY ROLLBACK STARTED"
            echo "=========================================="
            
            BACKUP_DIR="/var/backups/kongossa-pay/pre_migration"
            
            # Find latest backup
            LATEST_BACKUP=$(ls -t $BACKUP_DIR/pre_migration_final_*.sql.gz 2>/dev/null | head -1)
            if [ -z "$LATEST_BACKUP" ]; then
              LATEST_BACKUP=$(ls -t $BACKUP_DIR/pre_migration_*.sql.gz 2>/dev/null | head -1)
            fi
            
            if [ -n "$LATEST_BACKUP" ]; then
              echo "=== Restoring database from: $(basename $LATEST_BACKUP) ==="
              gunzip -c $LATEST_BACKUP | docker exec -i kongossa-postgres psql -U kongossa_user -d kongossa_db
              echo "✅ Database restored"
            else
              echo "⚠️ No backup found, continuing with current database"
            fi
            
            # Restore previous images
            if [ -f "$BACKUP_DIR/rollback_backend_image.txt" ]; then
              PREVIOUS_BACKEND=$(cat "$BACKUP_DIR/rollback_backend_image.txt")
              PREVIOUS_FRONTEND=$(cat "$BACKUP_DIR/rollback_frontend_image.txt")
              
              echo "=== Rolling back to previous images ==="
              echo "Backend: $PREVIOUS_BACKEND"
              echo "Frontend: $PREVIOUS_FRONTEND"
              
              # Update docker-compose
              sed -i "s|image: ghcr.io/.*/kongossa-backend:.*|image: $PREVIOUS_BACKEND|g" docker-compose.prod.yml
              sed -i "s|image: ghcr.io/.*/kongossa-frontend:.*|image: $PREVIOUS_FRONTEND|g" docker-compose.prod.yml
            fi
            
            echo "=== Restarting containers ==="
            docker compose -f docker-compose.prod.yml up -d
            
            echo "=== Verifying rollback ==="
            sleep 10
            
            if curl -f -s -o /dev/null http://localhost:3000/health; then
              echo "✅ Rollback successful"
            else
              echo "⚠️ Rollback may need manual verification"
            fi
            
            echo "=========================================="
            echo "✅ ROLLBACK COMPLETED"
            echo "=========================================="

  notify:
    name: Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy, rollback]
    if: always()
    
    steps:
      - name: Set status output
        id: status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "status=✅ DEPLOYMENT SUCCESS" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          elif [ "${{ needs.rollback.result }}" == "success" ]; then
            echo "status=⚠️ ROLLBACK COMPLETED" >> $GITHUB_OUTPUT
            echo "emoji=⚠️" >> $GITHUB_OUTPUT
          else
            echo "status=❌ DEPLOYMENT FAILED" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          fi
          
      - name: Print summary
        run: |
          echo "=========================================="
          echo "${{ steps.status.outputs.status }}"
          echo "=========================================="
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Time: $(date)"
          echo "=========================================="