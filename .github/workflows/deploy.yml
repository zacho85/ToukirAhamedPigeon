name: Deploy to Hetzner Production

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      skip_backup:
        description: 'Skip database backup (risky!)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  packages: write

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}
  BACKUP_RETENTION_DAYS: 7

jobs:
  backup-database:
    name: Backup Database Before Migration
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_backup != 'true'
    
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Create Database Backup
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          script: |
            set -e
            BACKUP_DIR="/var/backups/kongossa-pay"
            TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
            BACKUP_FILE="$BACKUP_DIR/backup_${TIMESTAMP}.sql.gz"
            
            echo "=== Creating backup directory ==="
            mkdir -p $BACKUP_DIR
            
            echo "=== Checking database container ==="
            if ! docker ps | grep -q kongossa-postgres; then
              echo "ERROR: Database container not running!"
              exit 1
            fi
            
            echo "=== Creating database backup ==="
            docker exec kongossa-postgres pg_dump -U postgres -d kongossa_db | gzip > $BACKUP_FILE
            
            echo "=== Verifying backup ==="
            if [ -f "$BACKUP_FILE" ]; then
              FILE_SIZE=$(ls -lh $BACKUP_FILE | awk '{print $5}')
              echo "✅ Backup created successfully: $BACKUP_FILE ($FILE_SIZE)"
            else
              echo "❌ Backup creation failed!"
              exit 1
            fi
            
            echo "=== Cleaning old backups (older than ${{ env.BACKUP_RETENTION_DAYS }} days) ==="
            find $BACKUP_DIR -name "backup_*.sql.gz" -type f -mtime +${{ env.BACKUP_RETENTION_DAYS }} -delete
            
            echo "=== Listing current backups ==="
            ls -lh $BACKUP_DIR/ | tail -5

  build-and-deploy:
    name: Build and Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: backup-database
    if: always() && (needs.backup-database.result == 'success' || needs.backup-database.result == 'skipped')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN_PAT }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/kongossa-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./kongossa-backend
          file: ./kongossa-backend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/kongossa-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./kongossa-pay-ts
          file: ./kongossa-pay-ts/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_APP_API_URL=https://api.kongossapay.com
            VITE_APP_DOMAIN=https://kongossapay.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on Hetzner Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /var/www/kongossa-pay
            
            echo "=== Pulling latest code ==="
            git fetch origin main
            git reset --hard origin/main
            
            echo "=== Stopping all containers ==="
            docker compose -f docker-compose.prod.yml down
            
            echo "=== Logging to GHCR ==="
            echo "${{ secrets.GH_TOKEN_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "=== Pulling latest images ==="
            docker compose -f docker-compose.prod.yml pull
            
            echo "=== Starting database first ==="
            docker compose -f docker-compose.prod.yml up -d postgres
            
            echo "=== Waiting for database to be ready ==="
            sleep 10
            
            echo "=== Creating database backup (pre-migration) ==="
            BACKUP_DIR="/var/backups/kongossa-pay/pre_migration"
            TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
            mkdir -p $BACKUP_DIR
            docker exec kongossa-postgres pg_dump -U postgres -d kongossa_db | gzip > "$BACKUP_DIR/pre_migration_${TIMESTAMP}.sql.gz"
            echo "✅ Pre-migration backup created"
            
            echo "=== Running database migrations with safety checks ==="
            echo "🔍 Checking migration status..."
            
            # Run migrations with --create-only flag first to check for conflicts
            if docker compose -f docker-compose.prod.yml run --rm backend npx prisma migrate status 2>&1 | grep -q "Database schema is up to date"; then
              echo "✅ No pending migrations. Database schema is up to date."
            else
              echo "⚠️ Pending migrations detected. Creating backup before applying..."
              
              # Create another backup just before migration
              docker exec kongossa-postgres pg_dump -U postgres -d kongossa_db | gzip > "$BACKUP_DIR/pre_migration_final_${TIMESTAMP}.sql.gz"
              
              echo "📊 Current migration status:"
              docker compose -f docker-compose.prod.yml run --rm backend npx prisma migrate status
              
              echo "🔄 Applying migrations..."
              if docker compose -f docker-compose.prod.yml run --rm backend npx prisma migrate deploy; then
                echo "✅ Migrations applied successfully"
              else
                echo "❌ Migration failed! Rolling back..."
                echo "To restore backup: gunzip < $BACKUP_DIR/pre_migration_final_${TIMESTAMP}.sql.gz | docker exec -i kongossa-postgres psql -U postgres -d kongossa_db"
                exit 1
              fi
            fi
            
            echo "=== Generating Prisma client ==="
            docker compose -f docker-compose.prod.yml run --rm backend npx prisma generate
            
            echo "=== Starting remaining containers ==="
            docker compose -f docker-compose.prod.yml up -d backend frontend
            
            echo "=== Waiting for services to be ready ==="
            sleep 15
            
            echo "=== Verifying database connection ==="
            if docker compose -f docker-compose.prod.yml exec -T backend node -e "require('@prisma/client').Prisma.getExtensionContext()" 2>/dev/null; then
              echo "✅ Database connection verified"
            else
              echo "⚠️ Database connection check failed, but continuing deployment"
            fi
            
            echo "=== Checking container status ==="
            docker ps | grep kongossa
            
            echo "=== Testing backend health ==="
            curl -f http://localhost:3000/health || echo "Health check not available"
            
            echo "=== Testing frontend ==="
            curl -f -I http://localhost || echo "Frontend not responding"
            
            echo "=== Cleaning up old images ==="
            docker system prune -f -a --filter "until=24h"
            
            echo "=== Deployment completed successfully! ==="

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: failure()
    concurrency:
      group: rollback
      cancel-in-progress: false
    
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Rollback on Hetzner Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /var/www/kongossa-pay
            
            echo "⚠️⚠️⚠️ ROLLBACK INITIATED ⚠️⚠️⚠️"
            
            echo "=== Stopping all containers ==="
            docker compose -f docker-compose.prod.yml down
            
            echo "=== Finding latest backup ==="
            BACKUP_DIR="/var/backups/kongossa-pay/pre_migration"
            LATEST_BACKUP=$(ls -t $BACKUP_DIR/pre_migration_*.sql.gz 2>/dev/null | head -1)
            
            if [ -n "$LATEST_BACKUP" ]; then
              echo "=== Restoring database from backup: $LATEST_BACKUP ==="
              docker start kongossa-postgres || docker compose -f docker-compose.prod.yml up -d postgres
              sleep 5
              gunzip -c $LATEST_BACKUP | docker exec -i kongossa-postgres psql -U postgres -d kongossa_db
              echo "✅ Database restored successfully"
            else
              echo "❌ No backup found! Manual intervention required."
              exit 1
            fi
            
            echo "=== Rolling back to previous Docker images ==="
            PREVIOUS_BACKEND_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep kongossa-backend | head -2 | tail -1)
            PREVIOUS_FRONTEND_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep kongossa-frontend | head -2 | tail -1)
            
            if [ -n "$PREVIOUS_BACKEND_IMAGE" ]; then
              sed -i "s|image: ghcr.io/.*/kongossa-backend:.*|image: $PREVIOUS_BACKEND_IMAGE|g" docker-compose.prod.yml
            fi
            
            if [ -n "$PREVIOUS_FRONTEND_IMAGE" ]; then
              sed -i "s|image: ghcr.io/.*/kongossa-frontend:.*|image: $PREVIOUS_FRONTEND_IMAGE|g" docker-compose.prod.yml
            fi
            
            echo "=== Restarting with previous images ==="
            docker compose -f docker-compose.prod.yml up -d
            
            echo "=== Rollback completed ==="
            echo "⚠️ Manual verification required! Check application status."

  notify:
    name: Send Deployment Notification
    runs-on: ubuntu-latest
    needs: [backup-database, build-and-deploy, rollback]
    if: always()
    
    steps:
      - name: Determine deployment status
        id: status
        run: |
          if [ "${{ needs.build-and-deploy.result }}" == "success" ]; then
            echo "status=✅ Deployment Successful!" >> $GITHUB_OUTPUT
            echo "color=success" >> $GITHUB_OUTPUT
          elif [ "${{ needs.rollback.result }}" == "success" ]; then
            echo "status=⚠️ Rollback Completed - Please Verify" >> $GITHUB_OUTPUT
            echo "color=warning" >> $GITHUB_OUTPUT
          else
            echo "status=❌ Deployment Failed!" >> $GITHUB_OUTPUT
            echo "color=failure" >> $GITHUB_OUTPUT
          fi
          
          if [ "${{ needs.backup-database.result }}" == "success" ]; then
            echo "backup=✅ Database backup created before migration" >> $GITHUB_OUTPUT
          else
            echo "backup=⚠️ No backup was created" >> $GITHUB_OUTPUT
          fi

      - name: Send notification to Slack (optional)
        if: false  # Enable this by removing 'if: false' and adding Slack webhook secret
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "${{ steps.status.outputs.status }}\nBackup: ${{ steps.status.outputs.backup }}\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}